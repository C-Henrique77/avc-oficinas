spring.application.name=avc-oficinas
server.port=8080

# Credenciais NAO ficam no codigo: vem de variaveis de ambiente (DB_URL, DB_USER, DB_PASSWORD)
# ou do arquivo local config/local.properties (ignorado pelo Git).
spring.config.import=optional:file:./config/local.properties

app.db.url=${DB_URL:jdbc:postgresql://localhost:5432/oficinas}
app.db.user=${DB_USER}
app.db.password=${DB_PASSWORD}
